name: Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  LFORTRAN_VERSION: 0.67.0

jobs:
  third_party_windows:
    name: Third Party Windows ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2025"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v2.0.2
        with:
          micromamba-version: '2.0.4-0'
          # environment.yml pins make=4.3, which conflicts with fpm on Windows
          environment-name: lf
          create-args: >-
            lfortran=${{ env.LFORTRAN_VERSION }}
            fpm=0.13.0
            make=4.4.1
            cmake=4.4.4
            ninja
            fypp=3.2

      # Makes the MSVC environment (link.exe, LIB, ...) available to all
      # following steps. LFortran uses link.exe to link executables.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # GitHub's Windows runners default to core.autocrlf=true, which checks
      # sources out with CRLF line endings. Check out as on Linux/macOS.
      - name: Disable Git CRLF conversion
        shell: bash -e -x -l {0}
        run: |
            git config --global core.autocrlf false

      - name: Print installed packages information
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            micromamba list
            which lfortran
            which link
            lfortran --version

      - name: Test Hello World
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            mkdir hello
            cd hello
            cat > hello.f90 <<'EOF'
            program hello
            implicit none
            integer :: i, s
            s = 0
            do i = 1, 10
                s = s + i
            end do
            print *, "Hello from LFortran on Windows, sum =", s
            if (s /= 55) error stop "wrong sum"
            end program
            EOF
            lfortran hello.f90 -o hello.exe
            ./hello.exe | tee out.txt
            grep -q "sum = *55" out.txt

      - name: Test Modern Minpack (Fortran-Lang)
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            git clone https://github.com/fortran-lang/minpack modern_minpack_01
            cd modern_minpack_01
            git checkout c0b5aea9fcd2b83865af921a7a7e881904f8d3c2
            lfortran ./src/minpack.f90 -c --legacy-array-sections
            lfortran ./examples/example_hybrd.f90 --legacy-array-sections

      - name: Test fortran-regex
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            git clone https://github.com/perazz/fortran-regex.git
            cd fortran-regex
            git checkout 96ab33fe003862a28cec91ddd170ac0e86c26c87
            fpm test --compiler=lfortran

      - name: Test fortran-shlex
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            git clone https://github.com/perazz/fortran-shlex.git
            cd fortran-shlex
            git checkout e20b6f86c82e33fae78b54b074bab5369efde6a3
            fpm test --compiler=lfortran --flag "--realloc-lhs-arrays"

      - name: Test toml-f
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            git clone https://github.com/toml-f/toml-f.git
            cd toml-f
            git checkout 27abd768e79c7c790ffa58fe5ccfb105ba00883d
            fpm test --compiler=lfortran --flag "--cpp --realloc-lhs-arrays"

      - name: Test Assert
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            git clone https://github.com/berkeleylab/assert.git
            cd assert
            git checkout 3.1.2
            test "$(git rev-parse HEAD)" = 1eb0cb9ce1421c76b6ab977370b6339918f20918
            fpm test --compiler=lfortran --flag "--cpp"
            rm -rf build
            fpm test --compiler=lfortran --flag "--cpp -DASSERTIONS -DASSERT_PARALLEL_CALLBACKS"

      - name: Test Parallel Research Kernels (serial)
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            ci/test_prk.sh serial

      - name: Test SNAP
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            git clone https://github.com/certik/SNAP.git
            cd SNAP
            git checkout 169a9216f2c922e94065a519efbb0a6c8b55149e
            cd src
            # Windows has no cpp; preprocess with LFortran instead
            make -j4 FORTRAN=lfortran FFLAGS= MPI=no OPENMP=no PP="bash ../../ci/lfortran_pp.sh"
            ./gsnap ../qasnap/sample/inp out

      - name: Test stdlib
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            git clone https://github.com/czgdp1807/stdlib.git
            cd stdlib
            git checkout abb1d33d6ae02d8b62a13be7f9e51f6117c67ba4
            cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=lfortran . -DTEST_DRIVE_BUILD_TESTING=OFF -DBUILD_EXAMPLE=ON -DCMAKE_Fortran_COMPILER_WORKS=TRUE -DCMAKE_Fortran_FLAGS="--cpp --realloc-lhs-arrays"
            cmake --build . -j4
            ctest --output-on-failure

      - name: Probe backspace after skipped records
        continue-on-error: true
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            mkdir bs2 && cd bs2
            cat > bs2.f90 <<'EOF'
            program bs2
            implicit none
            integer :: u, i, z, n
            real(8) :: e(3)
            open(newunit=u, file="bs2.txt", status="old")
            do i = 1, 2
                read(u, *)
            end do
            read(u, *) z
            do while (z /= 3)
                read(u, *)
                read(u, *) z
            end do
            read(u, *) n
            backspace(u)
            read(u, *) n, e(:n)
            close(u)
            print *, z, n, e(:n)
            if (n /= 3 .or. abs(e(3) + 3.5d0) > 1d-12) error stop "wrong"
            end program
            EOF
            lfortran bs2.f90 -o bs2.exe
            printf '# header 1\n# header 2\n1\n1 -1.5\n2\n2 -2.5 -2.25\n3\n3 -3.0 -3.25 -3.5\n' > bs2.txt
            ./bs2.exe && echo "LF: OK" || echo "LF: FAIL"
            printf '# header 1\r\n# header 2\r\n1\r\n1 -1.5\r\n2\r\n2 -2.5 -2.25\r\n3\r\n3 -3.0 -3.25 -3.5\r\n' > bs2.txt
            ./bs2.exe && echo "CRLF: OK" || echo "CRLF: FAIL"

      - name: Probe backspace in dftatom's data file
        continue-on-error: true
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            git clone https://github.com/certik/dftatom.git dftatom-probe
            cd dftatom-probe
            git checkout 9b678177f67e350b8a32e08cb61f51e6e708e87a
            cd tests/lda
            cat > bs3.f90 <<'EOF'
            program bs3
            implicit none
            integer :: u, i, fZ, n
            real(8) :: E_tot
            real(8), allocatable :: ks(:)
            open(newunit=u, file="nonrel_energies.dat", status="old")
            do i = 1, 5
                read(u, *)
            end do
            read(u, *) fZ
            do while (fZ /= 23)
                read(u, *)
                read(u, *)
                read(u, *) fZ
            end do
            read(u, *) E_tot
            read(u, *) n
            allocate(ks(n))
            backspace(u)
            read(u, *) n, ks
            close(u)
            print *, fZ, E_tot, n, ks(1)
            if (abs(ks(1) + 195.2240139984d0) > 1d-8) error stop "wrong ks(1)"
            end program
            EOF
            lfortran bs3.f90 -o bs3.exe
            ./bs3.exe

      - name: Probe backspace in a 1000-line file
        continue-on-error: true
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            mkdir bs45 && cd bs45
            cat > bs4.f90 <<'EOF'
            program bs4
            implicit none
            integer :: u, i, n
            open(newunit=u, file="bs4.txt", status="old")
            do i = 1, 900
                read(u, *) n
            end do
            backspace(u)
            read(u, *) n
            close(u)
            print *, "n =", n
            if (n /= 900) error stop "wrong record after backspace"
            end program
            EOF
            cat > bs5.f90 <<'EOF'
            program bs5
            implicit none
            integer :: u, i, n
            open(newunit=u, file="bs5.txt", status="replace")
            do i = 1, 1000
                write(u, '(i0)') i
            end do
            close(u)
            open(newunit=u, file="bs5.txt", status="old")
            do i = 1, 900
                read(u, *) n
            end do
            backspace(u)
            read(u, *) n
            close(u)
            print *, "n =", n
            if (n /= 900) error stop "wrong record after backspace"
            end program
            EOF
            lfortran bs4.f90 -o bs4.exe
            lfortran bs5.f90 -o bs5.exe
            seq 1000 > bs4.txt
            ./bs4.exe && echo "bs4 LF: OK" || echo "bs4 LF: FAIL"
            seq 1000 | sed 's/$/\r/' > bs4.txt
            ./bs4.exe && echo "bs4 CRLF: OK" || echo "bs4 CRLF: FAIL"
            ./bs5.exe && echo "bs5: OK" || echo "bs5: FAIL"
            od -c bs5.txt | head -2

      - name: Probe output before error stop
        continue-on-error: true
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            mkdir es && cd es
            cat > es.f90 <<'EOF'
            program es
            print *, "before error stop"
            error stop "stopping"
            end program
            EOF
            lfortran es.f90 -o es.exe
            ./es.exe > es.out 2> es.err || echo "exit code $?"
            echo "stdout:"; cat es.out
            echo "stderr:"; cat es.err

      - name: Probe vtable with --separate-compilation
        continue-on-error: true
        shell: bash -e -x -l {0}
        run: |
            source ci/windows_msvc.sh
            mkdir vtable && cd vtable
            cat > m.f90 <<'EOF'
            module m
              type :: t
              end type
            contains
              subroutine g()
                class(t), allocatable :: x
                allocate(x)
              end subroutine
            end module
            EOF
            cat > p.f90 <<'EOF'
            program p
              use m
              class(t), allocatable :: y
              allocate(y)
              call g()
              print *, "ok"
            end program
            EOF
            lfortran --separate-compilation -c m.f90 -o m.obj
            lfortran --separate-compilation -c p.f90 -o p.obj
            lfortran m.obj p.obj -o p.exe
            ./p.exe

      # Not tested yet on Windows:
      # * fpm: its C helper (filesystem_utilities.c) needs POSIX dirent.h,
      #   which MSVC does not provide (fpm supports MinGW on Windows).
      # * Julienne, Formal, Fiats, neural-fortran: LFortran link errors with
      #   MSVC (LNK1227 conflicting weak externals for _VTable_*, and
      #   unresolved module procedures without --separate-compilation).
      # * dftatom: `backspace` positions the file wrongly on Windows.
